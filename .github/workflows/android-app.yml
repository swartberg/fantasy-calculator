# Builds the Android app (APK) from the web app with Capacitor.
# On main, the APK is attached to the "android-latest" release:
#   https://github.com/swartberg/fantasy-calculator/releases/tag/android-latest
# Every build is signed with android-app/debug.keystore, so a new
# APK installs over the old one and saved teams are kept.
name: Android app

on:
  push:
    branches: [main, claude/repo-access-check-bdxzsk]
    paths:
      - "index.html"
      - "styles.css"
      - "scripts/**"
      - "images/**"
      - "android-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Copy the web app into the app
        run: |
          mkdir -p www
          cp -r ../index.html ../styles.css ../scripts ../images ../data www/

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: |
          node make-icon.mjs
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#150b05' --iconBackgroundColorDark '#150b05' \
            --splashBackgroundColor '#150b05' --splashBackgroundColorDark '#150b05'
          npx cap sync android

      - name: Version number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Use the app's fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EL-Fantasy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EL-Fantasy-apk
          path: android-app/EL-Fantasy.apk

      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest EL-Fantasy.apk \
            --target "${{ github.sha }}" \
            --title "Android app (latest)" \
            --notes "Built from ${{ github.sha }} (version 1.${{ github.run_number }}). On your phone: download EL-Fantasy.apk, open it and allow installing from this source. Newer versions install over older ones and keep your saved teams."
