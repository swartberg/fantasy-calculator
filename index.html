<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css?v=24">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap"
        rel="stylesheet"
    >

    <title>EL Fantasy Calculator</title>
</head>

<body>

    <div class="main-container">

        <!-- NAVBAR -->
        <header class="navbar">

            <svg
                class="navbar-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                aria-hidden="true"
            >
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18"></path>
                <path d="M12 3v18"></path>
                <path d="M5.6 5.6c3.2 3.4 3.2 9.4 0 12.8"></path>
                <path d="M18.4 5.6c-3.2 3.4-3.2 9.4 0 12.8"></path>
            </svg>

            <span>Fantasy Calculator</span>

        </header>


        <div class="content-grid">

            <!-- ROUND SELECTOR -->
            <div class="round-panel">

                <div class="round-heading">
                    <span class="round-heading-label">ROUND</span>
                    <span class="round-heading-number js-round-number">–</span>
                </div>

                <div class="round-status js-round-status">
                    <span class="round-status-dot"></span>
                    <span class="js-round-status-text">Finding current round…</span>
                </div>

                <div class="round-bar">

                    <button
                        class="round-nav js-round-prev"
                        type="button"
                        aria-label="Previous round"
                    >
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M15 5l-7 7 7 7"></path>
                        </svg>
                    </button>

                    <!-- Round chips are added by game-selector.js -->
                    <div class="round-strip js-round-strip"></div>

                    <button
                        class="round-nav js-round-next"
                        type="button"
                        aria-label="Next round"
                    >
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9 5l7 7-7 7"></path>
                        </svg>
                    </button>

                </div>


                <!--
                    Hidden original select.

                    Holds the selected round. The rest of the app
                    reads its value and listens for its change event.
                -->
                <select
                    class="js-select-round round-select-hidden"
                    aria-hidden="true"
                    tabindex="-1"
                >
                    <option value="1">Round 1</option>
                    <option value="2">Round 2</option>
                    <option value="3">Round 3</option>
                    <option value="4">Round 4</option>
                    <option value="5">Round 5</option>
                    <option value="6">Round 6</option>
                    <option value="7">Round 7</option>
                    <option value="8">Round 8</option>
                    <option value="9">Round 9</option>
                    <option value="10">Round 10</option>
                    <option value="11">Round 11</option>
                    <option value="12">Round 12</option>
                    <option value="13">Round 13</option>
                    <option value="14">Round 14</option>
                    <option value="15">Round 15</option>
                    <option value="16">Round 16</option>
                    <option value="17">Round 17</option>
                    <option value="18">Round 18</option>
                    <option value="19">Round 19</option>
                    <option value="20">Round 20</option>
                    <option value="21">Round 21</option>
                    <option value="22">Round 22</option>
                    <option value="23">Round 23</option>
                    <option value="24">Round 24</option>
                    <option value="25">Round 25</option>
                    <option value="26">Round 26</option>
                    <option value="27">Round 27</option>
                    <option value="28">Round 28</option>
                    <option value="29">Round 29</option>
                    <option value="30">Round 30</option>
                    <option value="31">Round 31</option>
                    <option value="32">Round 32</option>
                    <option value="33">Round 33</option>
                    <option value="34">Round 34</option>
                    <option value="35">Round 35</option>
                    <option value="36">Round 36</option>
                    <option value="37">Round 37</option>
                    <option value="38">Round 38</option>
                </select>

            </div>


            <!-- VIEW TABS -->
            <div class="view-tabs">

                <button
                    class="view-tab js-view-tab is-active"
                    data-view="game"
                    type="button"
                >
                    <svg
                        class="view-tab-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        aria-hidden="true"
                    >
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M3 12h18"></path>
                        <path d="M12 3v18"></path>
                        <path d="M5.6 5.6c3.2 3.4 3.2 9.4 0 12.8"></path>
                        <path d="M18.4 5.6c-3.2 3.4-3.2 9.4 0 12.8"></path>
                    </svg>

                    <span>Games</span>
                </button>

                <button
                    class="view-tab js-view-tab"
                    data-view="my-team"
                    type="button"
                >
                    <svg
                        class="view-tab-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle cx="9" cy="8" r="3.5"></circle>
                        <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path>
                        <circle cx="17" cy="9" r="2.5"></circle>
                        <path d="M16.5 14.2c2.9.2 5 2.2 5 5"></path>
                    </svg>

                    <span>My Team</span>
                </button>

                <button
                    class="view-tab js-view-tab"
                    data-view="top-players"
                    type="button"
                >
                    <svg
                        class="view-tab-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M7 4h10v5a5 5 0 0 1-10 0z"></path>
                        <path d="M7 6H4.5a2.5 2.5 0 0 0 2.8 3.5"></path>
                        <path d="M17 6h2.5a2.5 2.5 0 0 1-2.8 3.5"></path>
                        <path d="M12 14v3.5"></path>
                        <path d="M8.5 20.5h7l-.8-3h-5.4z"></path>
                    </svg>

                    <span>Top Players</span>
                </button>

            </div>


            <!-- GAME SELECTOR -->
            <div class="game-selector"></div>


            <!-- SELECTED GAME VIEW -->
            <div class="view-container js-view-game">

                <div class="stats-container">

                    <!-- HOME TEAM -->
                    <div class="home-column">

                        <div class="home-team-name">
                            <span class="js-home-team-name"></span>
                        </div>

                        <div class="home-team team-box">
                        </div>

                    </div>


                    <!-- AWAY TEAM -->
                    <div class="away-column">

                        <div class="away-team-name">
                            <span class="js-away-team-name"></span>
                        </div>

                        <div class="away-team team-box">
                        </div>

                    </div>

                </div>

            </div>


            <!-- MY TEAM VIEW -->
            <div class="view-container js-view-my-team">

                <!-- PLAYER SEARCH -->
                <div class="player-search">

                    <h6 class="player-search-title">Add players</h6>

                    <div class="player-search-field">

                        <input
                            class="player-search-input js-player-search-input"
                            type="search"
                            placeholder="Search player or team"
                            autocomplete="off"
                            aria-label="Search players"
                        >

                        <svg
                            class="player-search-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            aria-hidden="true"
                        >
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                        </svg>

                        <div class="player-search-results js-player-search-results"></div>

                    </div>

                </div>

                <div class="my-team-container">

                    <div class="my-team-empty">

                        <span>MY TEAM</span>

                        <p>
                            Select players from a game to add them here.
                        </p>

                    </div>

                </div>


                <!-- SEASON OVERVIEW (filled by season-overview.js) -->
                <div class="season-overview js-season-overview"></div>


                <!-- BACKUP -->
                <div class="team-backup">

                    <div class="my-team-section-title team-backup-title">BACKUP</div>

                    <p class="team-backup-text">
                        Your teams are saved only in this browser. Export a backup
                        to keep them safe or move them to another device.
                    </p>

                    <div class="team-backup-buttons">
                        <button class="team-backup-button js-export-teams" type="button">Export teams</button>
                        <button class="team-backup-button js-import-teams" type="button">Import teams</button>
                    </div>

                    <input
                        class="js-import-file"
                        type="file"
                        accept=".json,application/json"
                        hidden
                    >

                </div>

            </div>


            <!-- TOP PLAYERS VIEW -->
            <div class="view-container js-view-top-players">

                <div class="top-players-container"></div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script
        type="module"
        src="scripts/dom.js?v=24"
    ></script>

    <script
        type="module"
        src="scripts/view-selector.js?v=24"
    ></script>

</body>
</html>
